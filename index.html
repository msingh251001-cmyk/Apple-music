<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apple Music Web Style</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Liquid Background Gradients -->
  <div class="liquid-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="app-container">
    
    <!-- Top Navigation -->
    <header class="top-bar">
      <div class="logo" id="home-logo" style="cursor: pointer;"><i class="fa-brands fa-apple"></i> Music</div>
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="search-input" placeholder="Search songs, artists, albums...">
      </div>
      <button id="settings-btn" class="icon-btn"><i class="fas fa-gear"></i></button>
    </header>

    <!-- Main Dynamic Content Area -->
    <main class="content-area" id="main-content">
      <section class="section">
        <div class="section-header">
          <h2>Latest Releases</h2>
          <button class="see-all-btn" id="see-all-latest">See All <i class="fas fa-chevron-right"></i></button>
        </div>
        <div class="horizontal-scroll" id="latest-releases"></div>
      </section>

      <section class="section">
        <div class="section-header">
          <h2>Trending Now</h2>
          <button class="see-all-btn" id="see-all-trending">See All <i class="fas fa-chevron-right"></i></button>
        </div>
        <div class="horizontal-scroll" id="trending-songs"></div>
      </section>
    </main>

    <!-- Context Menu Modal (3 Dots Action Popup) -->
    <div class="modal" id="context-modal">
      <div class="modal-content context-box">
        <h4 id="context-song-title">Song Title</h4>
        <p id="context-song-artist">Artist Name</p>
        <hr style="border:0; border-top:1px solid rgba(255,255,255,0.1); margin:15px 0;">
        <button id="btn-play-next" class="menu-action-btn"><i class="fas fa-arrow-right-to-city"></i> Play Next</button>
        <button id="btn-add-queue" class="menu-action-btn"><i class="fas fa-list"></i> Add to Queue</button>
        <button id="close-context" class="primary-btn" style="margin-top:15px; background:#444;">Cancel</button>
      </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="settings-modal">
      <div class="modal-content">
        <h3>Content Language</h3>
        <p>Select your primary music preference:</p>
        <select id="language-select">
          <option value="punjabi" selected>Punjabi</option>
          <option value="hindi">Hindi</option>
          <option value="english">English</option>
        </select>
        <button id="close-settings" class="primary-btn">Save & Apply</button>
      </div>
    </div>

    <!-- Full Screen Player Overlay -->
    <div class="player-overlay" id="player-overlay">
      <button id="close-player" class="close-btn"><i class="fas fa-chevron-down"></i></button>
      
      <div class="player-content">
        <div class="album-art-container">
          <img src="https://via.placeholder.com/400" id="player-cover" alt="Album Cover">
        </div>

        <div class="player-details">
          <h2 id="player-title">Song Title</h2>
          <p id="player-artist">Artist Name</p>
        </div>

        <!-- Seek Bar -->
        <div class="progress-bar-container">
          <span id="current-time">0:00</span>
          <input type="range" id="seek-bar" value="0" min="0" max="100">
          <span id="total-duration">0:00</span>
        </div>

        <!-- Controls -->
        <div class="main-controls">
          <button id="autoplay-btn" class="icon-btn active"><i class="fas fa-infinity"></i></button>
          <button id="prev-btn" class="icon-btn"><i class="fas fa-step-backward"></i></button>
          <button id="play-btn" class="play-main-btn"><i class="fas fa-play"></i></button>
          <button id="next-btn" class="icon-btn"><i class="fas fa-step-forward"></i></button>
          <button id="queue-btn" class="icon-btn"><i class="fas fa-list-ul"></i></button>
        </div>

        <!-- Volume Bar -->
        <div class="volume-container">
          <i class="fas fa-volume-low"></i>
          <input type="range" id="volume-bar" min="0" max="1" step="0.01" value="0.8">
          <i class="fas fa-volume-high"></i>
        </div>
      </div>

      <!-- Up Next Queue Slide-Up Sheet -->
      <div class="queue-sheet" id="queue-sheet">
        <div class="queue-header">
          <h3>Up Next Queue</h3>
          <button id="close-queue" class="icon-btn"><i class="fas fa-xmark"></i></button>
        </div>
        <div class="queue-list" id="queue-list-container">
          <!-- Live Queue Items -->
        </div>
      </div>
    </div>

    <!-- Mini Player Bar -->
    <div class="mini-player" id="mini-player">
      <img src="https://via.placeholder.com/50" id="mini-cover" alt="Cover">
      <div class="mini-info">
        <h4 id="mini-title">No Song Selected</h4>
        <p id="mini-artist">Select a song to play</p>
      </div>
      <div class="mini-controls">
        <button id="mini-play-btn"><i class="fas fa-play"></i></button>
      </div>
    </div>

    <audio id="audio-element" crossorigin="anonymous"></audio>

  </div>

  <script src="script.js"></script>
</body>
          </html>
